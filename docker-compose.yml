version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: ai_platform_postgres
    restart: always
    environment:
      POSTGRES_DB: ai_platform_db
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_platform_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Redis Cache & Task Queue Service
  redis:
    image: redis:7-alpine
    container_name: ai_platform_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. MinIO S3 Object Storage Service
  minio:
    image: minio/minio:RELEASE.2024-03-15T20-13-24Z
    container_name: ai_platform_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 4. MLflow Tracking Server Service
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    container_name: ai_platform_mlflow
    restart: always
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow_artifacts --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_artifacts:/mlflow_artifacts

  # 5. Backend FastAPI ML Engine Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_platform_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://ai_user:ai_secure_password_2026@postgres:5432/ai_platform_db
      - JWT_SECRET_KEY=super_secret_jwt_key_ai_platform_2026_prod
      - ENVIRONMENT=production
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - models_registry:/app/models_registry
      - storage_data:/app/storage

  # 6. Frontend React Dashboard Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_platform_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  # 7. Nginx Production Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: ai_platform_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
  mlflow_artifacts:
  models_registry:
  storage_data:
  certbot_data:
