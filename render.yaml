services:
  # Backend FastAPI Service
  - type: web
    name: ai-platform-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-platform-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # Frontend Static Service
  - type: web
    name: ai-platform-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ai-platform-db
    databaseName: ai_platform_db
    user: ai_user
