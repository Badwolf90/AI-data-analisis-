# Nginx Production Reverse Proxy Configuration
# Optimized for SSE Telemetry Streaming, High Concurrency, Rate Limiting & SSL

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;  # Allow large dataset file uploads

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zone (10 requests per sec per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 1. HTTP Server (Redirect to HTTPS)
    server {
        listen 80;
        server_name aidataplatform.com www.aidataplatform.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Production Server
    server {
        listen 443 ssl http2;
        server_name aidataplatform.com www.aidataplatform.com;

        # SSL Certificates (Certbot Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/aidataplatform.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aidataplatform.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Frontend Static UI
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend FastAPI API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Realtime Telemetry SSE Stream (Disable Buffering)
        location /api/v1/telemetry/stream {
            proxy_pass http://backend:8000/api/v1/telemetry/stream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Cache-Control "no-cache";
            proxy_set_header Content-Type "text/event-stream";
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # Health & Readiness Probes
        location /health {
            proxy_pass http://backend:8000/health;
        }

        location /ready {
            proxy_pass http://backend:8000/ready;
        }
    }
}
